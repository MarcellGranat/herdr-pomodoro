[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "herdr-pomodoro"
version = "0.1.0"
description = "Private workspace activity tracking and Pomodoro focus sessions for Herdr"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Marcell Granat" }]
dependencies = []

[project.scripts]
herdr-pomodoro = "herdr_pomodoro.cli:main"

[dependency-groups]
dev = [
  "pyright>=1.1.407",
  "pytest>=8.4.2",
  "ruff>=0.14.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_pomodoro"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "error"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "UP035"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D103", "PLR2004", "S101", "TC001"]

