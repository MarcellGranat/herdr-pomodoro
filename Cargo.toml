[package]
name = "herdr-pomodoro"
version = "0.1.0"
edition = "2024"
description = "Private workspace activity tracking and Pomodoro focus sessions for Herdr"
license = "MIT"

[[bin]]
name = "herdr-pomodoro"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
fs2 = "0.4"
hex = "0.4"
hostname = "0.4"
libc = "0.2"
plist = "1.7"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.11", features = ["v4"] }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"

