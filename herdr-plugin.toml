id = "chmarax.herdr-pomodoro"
name = "Herdr Pomodoro"
version = "0.1.0"
min_herdr_version = "0.9.5"
platforms = ["macos", "linux"]
description = "Private human-activity accounting, focus sessions, and workspace reports"

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[startup]]
command = ["./target/release/herdr-pomodoro", "reconcile"]

[[actions]]
id = "menu"
title = "Pomodoro: open controls"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "open-menu"]

[[actions]]
id = "status"
title = "Pomodoro: status"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "status"]

[[actions]]
id = "start"
title = "Pomodoro: start focus"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "start"]

[[actions]]
id = "away"
title = "Pomodoro break: leave terminal (3 minutes)"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "away"]

[[actions]]
id = "workspace-grace"
title = "Pomodoro break: use other workspace (3 minutes)"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "workspace-grace"]

[[actions]]
id = "end"
title = "Pomodoro: end session"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "end"]

[[actions]]
id = "dashboard"
title = "Pomodoro: open activity dashboard"
contexts = ["workspace"]
command = ["./target/release/herdr-pomodoro", "open-dashboard"]

[[panes]]
id = "menu"
title = "Pomodoro controls"
placement = "popup"
width = "72%"
height = 18
command = ["./target/release/herdr-pomodoro", "menu"]

[[panes]]
id = "dashboard"
title = "Pomodoro activity"
placement = "tab"
command = ["./target/release/herdr-pomodoro", "dashboard"]

[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/herdr-pomodoro", "agent-event"]

